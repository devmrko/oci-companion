<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('준비 상태')}"></head><body><header th:replace="~{layout :: header}"></header><main class="catalog-shell page-content app-content"><div th:replace="~{layout :: notice}"></div><h1>준비 상태</h1>
<section class="card section-stack"><h2>빌드 선택</h2><form action="/readiness" method="get" class="form-toolbar" th:if="${pipelines != null}"><label class="form-field"><span><span th:replace="~{ui-help :: term('pipeline')}"></span> <span th:replace="~{ui-help :: required('필수')}"></span></span><select aria-label="빌드 파이프라인" name="pipeline" class="ui-control" required><option value="">선택</option><option th:each="p : ${pipelines}" th:value="${p.id()}" th:text="${p.name() + ' · ' + p.projectName()}" th:selected="${p.id() == pipeline}"></option></select></label><button class="ui-button">준비 상태 조회</button></form><p th:if="${pipelines != null and pipelines.isEmpty()}">빌드 파이프라인 없음</p><div class="form-toolbar"><a class="ui-button" href="/builds/configure">새 빌드 구성</a><a href="/guides#start">시작 순서</a></div></section>
<nav th:replace="~{build-context :: links(${pipeline})}"></nav><p th:if="${selectedName != null}" th:text="${selectedName}"></p><section th:replace="~{status-checks :: panel(${preparation},'준비 상태',true)}"></section>
<section class="card section-stack"><h2>배포 준비</h2><p class="small muted">배포 대상을 선택한 뒤 상태·이미지·명세를 점검합니다.</p><div class="form-toolbar"><a class="ui-button" href="/environments">배포 대상</a><a class="ui-button" href="/deployments/runs">배포 전 점검</a></div></section>
</main></body></html>
