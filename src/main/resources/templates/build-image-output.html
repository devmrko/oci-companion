<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="help"><details><summary>digest 기록 방법 ?</summary><p>OCI 명세의 exportedVariables에 BUILD_IMAGE_REFERENCE를 선언하고, 업로드 후 확정된 저장소@sha256:… 주소를 기록하세요. 앱이 정한 출력 이름이며 OCI 기본 변수는 아닙니다.</p><p class="small muted">OCI 콘솔 → DevOps → 프로젝트 → 빌드 파이프라인. 명세는 Git의 build_spec.yaml에서 수정합니다.</p><a class="ui-button" href="/templates/publish-build-image.sh" download>이미지 업로드 템플릿</a><a href="https://docs.oracle.com/en-us/iaas/Content/devops/using/build_specs.htm" target="_blank" rel="noopener noreferrer">OCI 빌드 출력 설정</a></details></div></body></html>
