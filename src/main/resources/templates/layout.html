<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' · OCI Companion'">OCI Companion</title><link rel="stylesheet" href="/app.css"><script src="/resource-description.js" defer></script></head>
<body>
<div th:fragment="header" class="app-chrome"><aside id="app-sidebar" class="app-sidebar"><a class="side-brand" href="/" title="OCI Companion"><span class="nav-icon" aria-hidden="true">◈</span><span class="nav-text">OCI Companion</span></a><nav class="side-nav" aria-label="주 메뉴">
<details class="nav-section" data-nav-group="overview" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-text">개요</span></summary><div class="nav-children">
<a class="side-item" href="/readiness" data-nav-key="readiness" title="준비 상태"><span class="nav-text">준비 상태</span></a>
<a class="side-item" href="/" data-nav-key="resources" title="리소스 조회"><span class="nav-text">리소스 조회</span></a>
</div></details>
<details class="nav-section" data-nav-group="source" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">⑂</span><span class="nav-text">소스</span></summary><div class="nav-children">
<a class="side-item" href="/sources" data-nav-key="sources" title="소스 저장소"><span class="nav-text">소스 저장소</span></a>
</div></details>
<details class="nav-section" data-nav-group="build" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">▷</span><span class="nav-text">빌드</span></summary><div class="nav-children">
<a class="side-item" href="/builds/tasks" data-nav-key="tasks" title="빌드 작업"><span class="nav-text">빌드 작업</span></a>
<a class="side-item" href="/builds/tasks?view=history" data-nav-key="history" title="실행 이력·비교"><span class="nav-text">실행 이력·비교</span></a>
<a class="side-item" href="/builds/automation" data-nav-key="automation" title="자동 실행"><span class="nav-text">자동 실행</span></a>
<a class="side-item" href="/builds?tab=pipelines" data-nav-key="pipelines" title="파이프라인 설정"><span class="nav-text">파이프라인 설정</span></a>
<a class="side-item" href="/builds/tasks?view=environments" data-nav-key="builders" title="빌드 환경"><span class="nav-text">빌드 환경</span></a>
</div></details>
<details class="nav-section" data-nav-group="artifacts" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">▱</span><span class="nav-text">산출물</span></summary><div class="nav-children">
<a class="side-item" href="/builds?tab=registry&amp;kind=GENERIC" data-nav-key="files" title="파일 저장소"><span class="nav-text">파일 저장소</span></a>
<a class="side-item" href="/builds?tab=registry&amp;kind=CONTAINER" data-nav-key="images" title="컨테이너 이미지"><span class="nav-text">컨테이너 이미지</span></a>
</div></details>
<details class="nav-section" data-nav-group="deploy" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">↑</span><span class="nav-text">배포</span></summary><div class="nav-children">
<a class="side-item" href="/deployments" data-nav-key="deployments" title="배포 작업"><span class="nav-text">배포 작업</span></a>
<a class="side-item" href="/deployments/runs" data-nav-key="deploy-history" title="실행 이력·복구"><span class="nav-text">실행 이력·복구</span></a>
</div></details>
<details class="nav-section" data-nav-group="operations" open><summary class="nav-section-title"><span class="nav-icon" aria-hidden="true">▣</span><span class="nav-text">환경·운영</span></summary><div class="nav-children">
<a class="side-item" href="/environments" data-nav-key="environments" title="배포 대상"><span class="nav-text">배포 대상</span></a>
<a class="side-item" href="/agents/connections" data-nav-key="monitoring" title="앱 모니터링"><span class="nav-text">앱 모니터링</span></a>
<a class="side-item" href="/backups" data-nav-key="backups" title="백업·복구"><span class="nav-text">백업·복구</span></a>

<a class="side-item" href="/builds?tab=projects" data-nav-key="projects" title="프로젝트"><span class="nav-text">프로젝트</span></a>
<a class="side-item" href="/builds?tab=topics" data-nav-key="topics" title="알림"><span class="nav-text">알림</span></a>
<a class="side-item" href="/guides" data-nav-key="guides" title="OCI 연결·권한 안내"><span class="nav-text">OCI 연결·권한 안내</span></a>
</div></details>
</nav></aside><header class="app-topbar"><button type="button" id="sidebar-toggle" aria-controls="app-sidebar" aria-expanded="true" aria-label="메뉴 접기" title="메뉴 접기" class="ui-button ui-button--inverse nav-toggle">☰</button><span class="topbar-title">OCI Companion</span><form th:if="${navSelection != null}" class="global-scope form-toolbar" th:action="@{/scope}" method="post"><input type="hidden" name="back" th:value="${scopeBack}"><label class="form-field form-field--compact form-field--inline"><span>리전</span><select name="region" class="ui-control ui-control--compact"><option th:each="r : ${navSelection.regions()}" th:value="${r.id()}" th:text="${r.name()}" th:selected="${r.id() == navSelection.region()}"></option></select></label><label class="form-field form-field--compact form-field--inline"><span th:replace="~{ui-help :: term('compartment')}"></span><select aria-label="리소스 구획" name="compartment" class="ui-control ui-control--compact"><option th:each="c : ${navSelection.compartments()}" th:value="${c.id()}" th:text="${c.name()}" th:selected="${c.id() == navSelection.compartment()}"></option></select></label><button class="ui-button ui-button--inverse">적용</button></form><div class="connection-summary" th:if="${connection != null}"><strong th:text="${connection.profile()}"></strong><span th:if="${navSelection == null}" th:text="${connection.region()}"></span><form th:action="@{/disconnect}" method="post"><button class="link ui-button ui-button--inverse" type="submit">연결 해제</button></form></div></header><div th:replace="~{ui-help :: dialog}"></div><script src="/ui-help.js" defer></script><script src="/navigation.js" defer></script></div>
<div th:fragment="notice"><div class="banner" role="alert" th:if="${scopeMessage}" th:text="${scopeMessage}"></div><div class="banner demo" th:if="${connection != null and connection.demo()}">데모 모드 · 샘플 응답입니다. 실제 OCI 연결·빌드·배포는 실행하지 않습니다.</div><div class="banner" role="alert" th:if="${message}" th:text="${message}"></div></div>
<footer th:fragment="footer" class="page-footer app-footer">OCI Companion</footer>
</body></html>
