<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' · OCI Companion'">OCI Companion</title><link rel="stylesheet" href="/app.css"></head>
<body>
<div th:fragment="header" class="app-chrome"><aside id="app-sidebar" class="app-sidebar"><a class="side-brand" href="/" title="OCI Companion"><span class="nav-icon" aria-hidden="true">◈</span><span class="nav-text">OCI Companion</span></a><nav class="side-nav" aria-label="주 메뉴"><p class="nav-group">워크스페이스</p><a class="side-item" href="/" data-nav-path="/" title="리소스"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-text">리소스</span></a><p class="nav-group">빌드·배포</p><a class="side-item" href="/sources" data-nav-path="/sources" title="소스"><span class="nav-icon" aria-hidden="true">⑂</span><span class="nav-text">소스</span></a><a class="side-item" href="/builds/tasks" data-nav-path="/builds" title="빌드"><span class="nav-icon" aria-hidden="true">▷</span><span class="nav-text">빌드</span></a><span class="side-item unavailable" aria-disabled="true" title="배포본 · 미구현"><span class="nav-icon" aria-hidden="true">▱</span><span class="nav-text">배포본</span><small class="nav-state">예정</small></span><span class="side-item unavailable" aria-disabled="true" title="배포 · 미구현"><span class="nav-icon" aria-hidden="true">↑</span><span class="nav-text">배포</span><small class="nav-state">예정</small></span><p class="nav-group">인프라·운영</p><span class="side-item unavailable" aria-disabled="true" title="실행 자원 · 미구현"><span class="nav-icon" aria-hidden="true">▣</span><span class="nav-text">실행 자원</span><small class="nav-state">예정</small></span><span class="side-item unavailable" aria-disabled="true" title="모니터링 · 미구현"><span class="nav-icon" aria-hidden="true">⌁</span><span class="nav-text">모니터링</span><small class="nav-state">예정</small></span><span class="side-item unavailable" aria-disabled="true" title="네트워크 · 미구현"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-text">네트워크</span><small class="nav-state">예정</small></span><span class="side-item unavailable" aria-disabled="true" title="백업·복구 · 미구현"><span class="nav-icon" aria-hidden="true">↶</span><span class="nav-text">백업·복구</span><small class="nav-state">예정</small></span><p class="nav-group">관리</p><a class="side-item" href="/guides" data-nav-path="/guides" title="OCI 사용 안내"><span class="nav-icon" aria-hidden="true">?</span><span class="nav-text">OCI 사용 안내</span></a><span class="side-item unavailable" aria-disabled="true" title="설정 · 미구현"><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-text">설정</span><small class="nav-state">예정</small></span></nav></aside><header class="app-topbar"><button type="button" id="sidebar-toggle" aria-controls="app-sidebar" aria-expanded="true" aria-label="메뉴 접기" title="메뉴 접기" class="ui-button ui-button--inverse nav-toggle">☰</button><span class="topbar-title">OCI Companion</span><form th:if="${navSelection != null}" class="global-scope form-toolbar" th:action="@{/scope}" method="post"><input type="hidden" name="back" th:value="${scopeBack}"><label class="form-field form-field--compact form-field--inline"><span>리전</span><select name="region" class="ui-control ui-control--compact"><option th:each="r : ${navSelection.regions()}" th:value="${r.id()}" th:text="${r.name()}" th:selected="${r.id() == navSelection.region()}"></option></select></label><label class="form-field form-field--compact form-field--inline"><span>구획</span><select name="compartment" class="ui-control ui-control--compact"><option th:each="c : ${navSelection.compartments()}" th:value="${c.id()}" th:text="${c.name()}" th:selected="${c.id() == navSelection.compartment()}"></option></select></label><button class="ui-button ui-button--inverse">적용</button></form><div class="connection-summary" th:if="${connection != null}"><strong th:text="${connection.profile()}"></strong><span th:if="${navSelection == null}" th:text="${connection.region()}"></span><form th:action="@{/disconnect}" method="post"><button class="link ui-button ui-button--inverse" type="submit">연결 해제</button></form></div></header><script src="/navigation.js" defer></script></div>
<div th:fragment="notice"><div class="banner" role="alert" th:if="${scopeMessage}" th:text="${scopeMessage}"></div><div class="banner demo" th:if="${connection != null and connection.demo()}">데모 모드 · 샘플 응답입니다. 실제 OCI 연결·빌드·배포는 실행하지 않습니다.</div><div class="banner" role="alert" th:if="${message}" th:text="${message}"></div></div>
<footer th:fragment="footer" class="page-footer app-footer">OCI Companion</footer>
</body></html>
