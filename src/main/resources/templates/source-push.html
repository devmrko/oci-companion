<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('OCI 저장소로 소스 보내기')}"></head><body><header th:replace="~{layout :: header}"></header><main><h1>OCI 저장소로 소스 보내기</h1><p>등록한 Git 소스의 커밋 이력을 OCI 저장소의 새 브랜치로 보냅니다. 초기 커밋이 있는 main은 유지합니다. 완료 후 빌드 구성에서 새 브랜치를 선택하세요.</p><p th:if="${message}" th:text="${message}" role="status"></p>
<form th:if="${plan == null}" method="post" th:action="@{/sources/push/preview}" class="card section-stack"><input type="hidden" name="region" th:value="${selection.region()}"><input type="hidden" name="compartment" th:value="${selection.compartment()}"><label>등록 소스<select name="source" required><option th:each="s : ${sources}" th:value="${s.id()}" th:text="${s.name()}"></option></select></label><label>소스 브랜치<input name="branch" value="main" required></label><label>소스 Git 사용자<input name="username" required></label><label>소스 인증 참조<input name="secret" placeholder="env:GITEA 또는 Vault Secret 참조" required autocomplete="off"></label><label>대상 OCI 저장소<select name="destination" required><option th:each="s : ${sources}" th:if="${s.provider() == 'OCI'}" th:value="${s.id()}" th:text="${s.name()}"></option></select></label><label>새 브랜치<input name="targetBranch" value="companion/import" required></label><label>OCI Git 사용자<input name="targetUsername" required></label><label>OCI 인증 참조<input name="targetSecret" required autocomplete="off"></label><p>토큰 값은 입력하지 마세요. 서버에 등록된 env 참조 또는 Vault Secret 참조를 사용합니다. Git LFS 객체는 별도로 전송해야 합니다.</p><button>push 미리보기</button></form>
<section th:if="${plan != null}" class="card"><h2>새 브랜치 push 미리보기</h2><p th:text="${plan.source().source().name()+' / '+plan.source().branch()+' → '+plan.destination().source().name()+' / '+plan.destination().branch()}"></p><code th:text="${plan.revision()}"></code><form method="post" th:action="@{/sources/push/run}"><input name="ticket" type="hidden" th:value="${ticket}"><label><input name="confirmed" type="checkbox" value="true" required>위 커밋 이력을 새 브랜치로 보냅니다.</label><button>확인 후 push</button></form></section><a href="/sources">소스 목록</a></main></body></html>
