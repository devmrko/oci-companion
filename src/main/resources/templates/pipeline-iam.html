<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('파이프라인 IAM 점검')}"></head><body>
<header th:replace="~{layout :: header}"></header><main>
<h1>파이프라인 IAM 점검</h1><p>사용자 그룹과 별도로 파이프라인 리소스 주체에 필요한 권한을 확인합니다.</p>
<p th:if="${message}" th:text="${message}" role="status"></p>
<p th:if="${check.root()}" class="warning">루트 구획입니다. 생성 정책은 테넌시 전체에 넓은 권한을 부여합니다.</p>
<p th:unless="${check.inspected()}" class="warning">조회하지 못했습니다. 권한이 없는 상태로 확정할 수 없습니다.</p>
<pre th:text="${check.error()}"></pre><p th:if="${check.ready()}">필요한 정책 문장을 확인했습니다. 실제 실행에는 권한 전파와 대상 리소스 확인이 필요합니다.</p>
<p th:each="warning : ${check.warnings()}" th:text="${warning}"></p>
<section th:if="${check.inspected() and !check.missing().isEmpty()}" class="card"><h2>생성 미리보기</h2>
<p th:text="${check.createGroup() ? '새 동적 그룹과 부족한 권한의 새 정책을 생성합니다.' : '기존 동적 그룹에 부족한 권한만 새 정책으로 생성합니다.'}"></p>
<p th:text="${check.groupName()}"></p><pre th:if="${check.createGroup()}" th:text="${check.rule()}"></pre>
<pre th:each="line : ${check.missing()}" th:text="${line}"></pre>
<details><summary>OCI CLI 명령</summary><textarea id="iam-command" readonly rows="10" th:text="${iamCli}"></textarea><button type="button" onclick="navigator.clipboard.writeText(document.getElementById('iam-command').value)">명령 복사</button></details>
<form th:action="@{/builds/iam/create}" method="post"><input type="hidden" name="ticket" th:value="${ticket}"><label><input type="checkbox" name="confirmed" value="true" required>표시된 범위·규칙·권한으로 새 리소스를 생성합니다.</label><button type="submit" th:disabled="${connection.demo()}">확인 후 생성</button></form>
<p>생성 권한이 없는 경우 OCI 오류가 표시됩니다. 기존 동적 그룹과 정책은 수정하지 않습니다.</p></section>
<a th:href="@{/builds/iam(pipeline=${pipeline})}">다시 점검</a> · <a th:href="@{/builds(tab='execute',pipeline=${pipeline})}">빌드 실행으로 돌아가기</a>
</main></body></html>
