<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('NodePort 보안 규칙')}"></head><body><header th:replace="~{layout :: header}"></header><main class="catalog-shell page-content app-content"><h1>NodePort 워커 보안 규칙</h1><p>한 IPv4 주소(/32)에서 지정한 TCP NodePort로 접근을 허용합니다. 기존 규칙은 보존합니다.</p><p th:if="${message}" th:text="${message}" role="status"></p>
<form method="get" th:action="@{/environments/oke/nodeport}"><label>클러스터<select name="cluster"><option th:each="item : ${clusters}" th:value="${item.id()}" th:text="${item.name()}" th:selected="${item.id()==cluster}"></option></select></label><button>워커 보안 목록 조회</button></form>
<form th:if="${lists != null}" method="get" th:action="@{/environments/oke/nodeport}" class="card section-stack"><input type="hidden" name="cluster" th:value="${cluster}"><label>워커 서브넷 보안 목록<select name="list"><option th:each="item : ${lists}" th:value="${item.id()}" th:text="${item.name()}"></option></select></label><label>출발지 IPv4 /32<input name="source" placeholder="192.0.2.10/32" required></label><label>NodePort<input type="number" name="port" min="30000" max="32767" value="30080" required></label><label>작업<select name="remove"><option value="false">새 규칙 추가</option><option value="true">Companion이 추가한 규칙 제거</option></select></label><button>변경 미리보기</button></form>
<section th:if="${preview != null}" class="card"><h2>변경 미리보기</h2><p th:text="${preview.name()}"></p><p th:text="${preview.source()+' → TCP '+preview.port()}"></p><p th:text="${preview.remove() ? 'Companion 표시가 있는 해당 규칙만 제거합니다.' : '새 규칙 한 개를 추가합니다.'}"></p><p th:text="${'현재 수신 규칙 '+preview.existingRules()+'개. 나머지 규칙과 송신 규칙은 유지합니다.'}"></p><p>실행 직전 변경 여부를 다시 확인하고 기존 보안 목록을 로컬에 백업합니다.</p><form method="post" th:action="@{/environments/oke/nodeport}"><input type="hidden" name="ticket" th:value="${ticket}"><label><input type="checkbox" name="confirmed" value="true" required>표시된 보안 규칙 변경을 확인했습니다.</label><button>확인 후 실행</button></form></section><a th:href="@{/deployments/oke/configure}">배포 구성</a></main></body></html>
