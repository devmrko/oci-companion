<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="panel(summary,title,preparing)" class="card section-stack status-panel" th:if="${summary != null}" th:attr="data-check-context=${preparing ? 'preparation' : 'result'}"><div class="section-title"><h2 th:text="${title}"></h2><span class="small muted" th:if="${preparing}" th:text="|필수 충족 ${summary.satisfied()}/${summary.required()} · 조치 ${summary.action()} · 미확인 ${summary.unknown()}|"></span></div>
<p class="small muted" th:text="${preparing ? '설정 조회 기준 · 실행 성공과 별개' : '선택한 실행의 결과 · 준비 상태와 별개'}"></p>
<ul class="check-grid"><li class="check-item" th:each="item : ${summary.items()}" th:attr="data-check=${item.key()},data-state=${item.state().name()}"><div class="check-title"><strong th:text="${item.name()}"></strong><span th:replace="~{ui-help :: required(${item.requirement()})}"></span></div><span class="check-state"><span class="status-dot" aria-hidden="true"></span><span class="check-state-label" th:text="${item.state().label()}"></span></span><p class="check-note" th:text="${item.note()}"></p><a class="check-action" th:href="${item.href()}" th:text="${item.action()}"></a></li></ul>
<details class="status-legend"><summary>표시 기준 ?</summary><p>충족: 확인한 조건 통과 · 확인 필요: 경고·중단 · 조치 필요: 실패·필수 누락 · 미확인: 근거 부족 · 해당 없음: 현재 작업에서 생략</p><p>필수: 현재 작업에 필요 · 조건부 필수: 저장·배포 선택 시 필요 · 선택: 생략 가능</p><p>조회 성공으로 실행 권한을 판단하지 않습니다. 선택 기능의 미설정은 경고로 표시하지 않습니다.</p></details>
</section></body></html>
