<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('트리거 생성')}"></head><body><main class="catalog-shell"><section class="card"><h1>트리거 생성</h1><p th:text="${created.id()}"></p><th:block th:if="${!created.url().isEmpty()}"><h2>저장소 Webhook 연결</h2><p>선택한 GitHub·GitLab 저장소의 Settings → Webhooks에서 아래 URL·Secret과 선택한 이벤트를 설정하세요.</p><label class="form-field">Webhook URL<input class="ui-control" readonly th:value="${created.url()}"></label><label class="form-field">Secret · 이번 응답에서만 표시<input class="ui-control" type="password" readonly th:value="${created.secret()}" autocomplete="off"></label><p>앱은 Secret을 JSON·세션에 저장하지 않습니다. 분실 시 OCI 콘솔에서 재설정하세요.</p></th:block><p th:if="${created.url().isEmpty()}">OCI 저장소의 조건에 맞는 이벤트부터 실행합니다.</p><a class="ui-button" th:href="@{/builds/automation(pipeline=${pipeline})}">트리거 목록 확인</a></section></main></body></html>
