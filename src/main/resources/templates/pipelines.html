<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('파이프라인')}"></head><body><header th:replace="~{layout :: header}"></header><main class="page-content app-content"><div th:replace="~{layout :: notice}"></div><a th:href="@{/projects/{id}(id=${workspace.id()})}">← 프로젝트</a><h1>OCI 파이프라인</h1><p class="muted">현재 컴파트먼트에서 조회한 목록입니다. 사용할 OCID를 프로젝트 설정에 입력하세요. 배포 대상 지원 여부는 실행 전에 검사합니다.</p><section class="card"><p th:if="${pipelines.isEmpty()}">조회된 파이프라인이 없습니다.</p><table th:unless="${pipelines.isEmpty()}" class="data-table"><thead><tr><th class="table-heading">종류</th><th class="table-heading">이름</th><th class="table-heading">OCID</th></tr></thead><tbody><tr th:each="p : ${pipelines}"><td th:text="${p.kind()}" class="table-cell"></td><td th:text="${p.name()}" class="table-cell"></td><td class="mono table-cell" th:text="${p.id()}"></td></tr></tbody></table></section><a class="button" th:href="@{/projects/{id}/edit(id=${workspace.id()})}">프로젝트 설정 편집</a></main></body></html>
