<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('배포 실행')}"></head><body><header th:replace="~{layout :: header}"></header>
<main class="catalog-shell page-content app-content"><div th:replace="~{layout :: notice}"></div><h1>배포 실행</h1>
<p>준비된 VM 릴리스를 활성화하거나 이전 릴리스로 복구합니다. 아래에서 파이프라인과 대상을 확인한 뒤 실행하세요.</p>
<p class="small muted">현재는 고정 VM과 인라인 배포 명세를 사용하는 단일 Instance Group 단계만 지원합니다. 패키지 설치와 파이프라인 등록은 먼저 완료해야 합니다.</p>
<a class="ui-button" href="/deployments">배포 환경 보기</a><p class="notice" th:if="${deploymentError != null}" th:text="${deploymentError}"></p>
<form action="/deployments/runs" method="get" class="card form-toolbar" th:if="${pipelines != null}"><label class="form-field">배포 파이프라인<select class="ui-control" name="pipeline" required><option value="">선택</option><option th:each="p : ${pipelines}" th:value="${p.id()}" th:selected="${p.id() == pipelineId}" th:text="${p.name() + ' · ' + p.state()}"></option></select></label><button class="ui-button">대상 확인</button></form>
<section class="card section-stack" th:if="${plan != null}"><h2>실행 전 확인</h2><p th:text="${plan.name()}"></p><p th:text="${'배포 환경: ' + plan.environment()}"></p><ul><li class="source-url" th:each="id : ${plan.instances()}" th:text="${id}"></li></ul><p>파이프라인이 VM에서 실행됩니다. 복구하려면 이전 버전용 파이프라인을 선택하세요. 데이터베이스 데이터 복구는 수행하지 않습니다.</p><form th:action="@{/deployments/runs}" method="post"><input type="hidden" name="ticket" th:value="${ticket}"><button class="ui-button primary">확인한 배포 실행</button></form></section>
<section class="card section-stack" th:if="${run != null}"><h2>OCI 배포 상태</h2><strong th:text="${run.state()}"></strong><p th:text="${run.name()}"></p><p th:text="${run.detail()}"></p><details><summary>실행 ID</summary><p class="source-url" th:text="${run.id()}"></p></details><a class="ui-button" th:href="@{/deployments/runs(pipeline=${pipelineId},run=${run.id()})}">상태 새로고침</a><a class="ui-button" href="/agents">에이전트 상태 확인</a></section>
</main><footer th:replace="~{layout :: footer}"></footer></body></html>
