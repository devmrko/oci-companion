<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('프로젝트')}"></head><body><header th:replace="~{layout :: header}"></header><main>
<div th:replace="~{layout :: notice}"></div><div class="page-heading"><div><div class="eyebrow">WORKSPACE</div><h1>프로젝트</h1><p class="muted">소스, 빌드 설정, 실행 이력을 애플리케이션별로 관리합니다.</p></div><a class="button primary" href="/projects/new">＋ 프로젝트 등록</a></div>
<div class="stats"><section class="card"><span class="muted">연결된 tenancy</span><strong th:text="${connection.label()}"></strong></section><section class="card"><span class="muted">프로젝트</span><strong th:text="${workspaces.size()}"></strong></section><section class="card"><span class="muted">배포 지원</span><strong>Compute VM</strong></section></div>
<div class="empty card" th:if="${workspaces.isEmpty()}"><h2>등록된 프로젝트 없음</h2><p>Git 저장소 · 빌드 도구 · OCI 파이프라인 등록</p><a class="button" href="/projects/new">프로젝트 등록</a><a href="/guides">OCI 설정 안내 →</a></div>
<div class="project-grid"><a class="card project-card" th:each="w : ${workspaces}" th:href="@{/projects/{id}(id=${w.id()})}"><span class="badge" th:text="${w.recipe()}"></span><h2 th:text="${w.name()}"></h2><p class="muted truncate" th:text="${w.repositoryUrl()}"></p><div class="card-bottom"><span th:text="${w.branch()}"></span><span>프로젝트 열기 →</span></div></a></div>
<section class="card storage"><h3>저장 위치와 책임</h3><p>프로젝트 설정·요청 이력은 로컬 SQLite에 저장됩니다. 실제 파이프라인·실행 상태·배포본은 OCI가 관리합니다. 프로파일 이름이 달라도 같은 tenancy·사용자·리전이면 같은 작업 공간을 사용합니다.</p></section>
</main><footer th:replace="~{layout :: footer}"></footer></body></html>
