<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="form" class="card" th:if="${tab == 'pipelines'}" data-flow-step="settings">
<details><summary>빌드 명세 작성</summary>
<form th:action="@{/builds/specification}" method="post" class="build-field-grid" id="build-specification-form">
<label class="form-field">빌드 도구<select name="tool" class="ui-control"><option value="maven">Maven</option><option value="gradle">Gradle</option><option value="python">Python · pytest</option><option value="node">JavaScript/TypeScript · npm</option></select></label>
<label class="form-field"><span id="build-tasks-label">Goal</span><input name="tasks" class="ui-control" value="verify" required maxlength="1000" list="build-task-options"><datalist id="build-task-options"><option value="test"></option><option value="package"></option><option value="verify"></option></datalist></label>
<label class="form-field">Maven profile · 선택<input name="profiles" class="ui-control" maxlength="255" placeholder="ci"></label>
<label class="form-field">작업 경로<input name="directory" class="ui-control" value="." required maxlength="1024"></label>
<label class="form-field">출력 이름 · 저장 시 필수<input name="outputName" class="ui-control" maxlength="255" placeholder="application"></label>
<label class="form-field">출력 파일 · 저장 시 필수<input name="location" class="ui-control" maxlength="1024" placeholder="target/application.jar"></label>
<div class="form-toolbar"><button class="ui-button">명세 미리보기</button></div></form>
<p class="small muted">초안입니다. 런타임·의존성과 명령을 확인하고 build_spec.yaml로 소스에 커밋하세요.</p>
<p id="build-specification-status" role="status"></p><pre class="code-block" id="build-specification-preview" hidden></pre><button type="button" class="ui-button" id="build-specification-download" hidden>build_spec.yaml 다운로드</button>
</details></section></body></html>
