<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="schedules(p)"><div class="table-scroll"><table class="data-table"><thead><tr><th class="table-heading">주기·유형</th><th class="table-heading">시점·시간대</th><th class="table-heading">보존</th><th class="table-heading">보호</th></tr></thead><tbody><tr th:each="s : ${p.schedules()}"><td class="table-cell" th:text="${s.period() + ' · ' + s.type()}"></td><td class="table-cell" th:text="${s.timing() + ' · ' + s.zone()}"></td><td class="table-cell" th:text="${s.retention()}"></td><td class="table-cell" th:text="${(s.locked() ? '보존 잠금 ' : '') + (s.protectedFromDeletion() ? '삭제 보호' : '')}"></td></tr></tbody></table></div></th:block></body></html>
