<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<span th:fragment="term(key)" class="term-label" th:with="term=${@uiTerms.get(key)}"><span th:text="${term.label()}"></span><a class="term-help" th:href="@{/guides} + '#term-' + ${key}" th:attr="data-term=${key},aria-label=${term.label() + ' 설명'}">?</a></span>
<span th:fragment="required(kind)" class="requirement-badge" th:attr="data-requirement=${kind}" th:text="${kind}"></span>
<dialog th:fragment="dialog" id="term-dialog" class="term-dialog" aria-labelledby="term-title"><form method="dialog" class="dialog-actions"><button class="ui-button" aria-label="도움말 닫기">닫기</button></form><h2 id="term-title">용어 안내</h2><section th:each="term : ${@uiTerms.all()}" th:attr="data-term-content=${term.key()}" hidden><h3 th:text="${term.label()}"></h3><p th:text="${term.nativeName()}"></p><p th:text="${term.description()}"></p><dl class="build-facts"><div><dt>OCI 콘솔</dt><dd th:text="${term.console()}"></dd></div></dl><pre class="code-block" th:text="${term.cli()}"></pre><p class="small muted">CLI에 --profile과 --region을 지정하세요.</p></section></dialog>
<section th:fragment="glossary" class="card section-stack" id="terms"><h2>용어·조건</h2><p><span th:replace="~{ui-help :: required('필수')}"></span> 현재 작업에 필요 · <span th:replace="~{ui-help :: required('조건부 필수')}"></span> 선택한 작업에 따라 필요 · <span th:replace="~{ui-help :: required('선택')}"></span> 생략 가능</p><details th:each="term : ${@uiTerms.all()}" th:id="'term-' + ${term.key()}"><summary th:text="${term.label() + ' · ' + term.nativeName()}"></summary><p th:text="${term.description()}"></p><p th:text="${term.console()}"></p><pre class="code-block" th:text="${term.cli()}"></pre></details></section>
</body></html>
