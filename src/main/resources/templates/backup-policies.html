<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('정기 백업 정책')}"></head><body><header th:replace="~{layout :: header}"></header>
<main class="catalog-shell page-content app-content section-stack"><div th:replace="~{layout :: notice}"></div>
<div class="form-toolbar"><h1>백업·복구</h1><a th:href="@{/backups/policies(volume=${volume})}" class="ui-button">새로 조회</a></div>
<nav class="build-tabs"><a class="build-tab" href="/backups">백업·복구</a><a class="build-tab is-active" href="/backups/policies">정기 정책</a></nav>
<section th:if="${plan != null}" class="card section-stack"><h2>정책 변경 확인</h2><p class="task-selection-summary" th:text="${plan.state().name()}"></p><p th:text="${currentPolicy + ' → ' + (plan.selected() == null ? '연결 해제' : plan.selected().name())}"></p><p th:if="${plan.selected() != null}">기존 정책이 교체됩니다. OCI가 일정에 따라 백업을 생성하며 비용이 발생합니다.</p><p th:if="${plan.selected() == null}">이 볼륨의 정책 연결을 해제합니다. 기존 백업은 삭제하지 않습니다.</p>
<div th:if="${plan.selected() != null}" th:insert="~{backup-policy-schedules :: schedules(${plan.selected()})}"></div>
<form th:action="@{/backups/policies/apply}" method="post" class="form-toolbar"><input type="hidden" name="ticket" th:value="${ticket}"><button class="ui-button primary">정책 변경 실행</button><a th:href="@{/backups/policies(volume=${volume})}" class="ui-button">취소</a></form></section>
<section class="card section-stack"><h2>볼륨 정책</h2><form action="/backups/policies" method="get" class="form-toolbar"><label class="form-field">블록 볼륨 · 필수<select name="volume" class="ui-control" required><option value="">선택</option><option th:each="v : ${volumes}" th:if="${v.state() == 'AVAILABLE'}" th:value="${v.id()}" th:selected="${v.id() == volume}" th:text="${v.name() + ' · ' + v.size() + ' GB'}"></option></select></label><button class="ui-button">연결 조회</button></form>
<div th:if="${state != null}" class="section-stack"><a th:href="@{/backups(backupVolume=${volume})}+'#backup-history'" class="ui-button">이 볼륨의 백업 이력</a><p>현재 정책: <strong th:text="${currentPolicy}"></strong></p><p th:if="${!state.group().isEmpty()}" class="small muted">볼륨 그룹 소속입니다. OCI 콘솔에서 그룹 정책을 관리하세요.</p>
<div th:if="${state.group().isEmpty()}" class="section-stack"><form th:action="@{/backups/policies/preview}" method="post" class="form-toolbar"><input type="hidden" name="volume" th:value="${volume}"><input type="hidden" name="operation" value="ASSIGN"><label class="form-field">연결할 정책 · 필수<select name="policy" class="ui-control" required><option value="">선택</option><option th:each="p : ${policies}" th:value="${p.id()}" th:disabled="${!p.destination().isEmpty() or (state.current() != null and state.current().policy() == p.id())}" th:text="${p.name() + (p.oracleDefined() ? ' · Oracle 제공' : '') + (!p.destination().isEmpty() ? ' · 콘솔에서 연결' : '')}"></option></select></label><button class="ui-button">변경값 확인</button></form>
<form th:if="${state.current() != null}" th:action="@{/backups/policies/preview}" method="post" class="form-toolbar"><input type="hidden" name="volume" th:value="${volume}"><input type="hidden" name="operation" value="REMOVE"><button class="ui-button">연결 해제 확인</button></form></div></div></section>
<section class="card section-stack"><h2>사용 가능한 정책</h2><p class="small muted">Oracle 제공 정책과 선택 구획의 정책입니다. 정책 작성·수정, 리전 간 복사 설정은 OCI 콘솔에서 관리하세요.</p><p th:if="${policies.isEmpty()}">조회된 정책 없음</p><details th:each="p : ${policies}"><summary th:text="${p.name() + (p.oracleDefined() ? ' · Oracle 제공' : ' · 사용자 정책')}"></summary><p class="source-url" th:text="${p.id()}"></p><p th:if="${!p.destination().isEmpty()}" th:text="${'복사 대상 리전: ' + p.destination()}"></p><div th:insert="~{backup-policy-schedules :: schedules(${p})}"></div></details></section>
<div th:replace="~{backup-help :: policy(false)}"></div>
</main><footer th:replace="~{layout :: footer}"></footer>

</body></html>
