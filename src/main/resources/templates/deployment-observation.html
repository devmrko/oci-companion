<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('배포 후 앱 확인')}"></head><body><header th:replace="~{layout :: header}"></header><main class="catalog-shell page-content app-content"><div th:replace="~{layout :: notice}"></div><h1>배포 후 앱 확인</h1><div class="form-toolbar"><a class="ui-button" th:href="@{/deployments/runs(pipeline=${pipelineId},run=${runId})}">배포 상태·로그</a><a class="ui-button" href="/agents/connections">등록 앱 상태</a></div>
<p class="notice" th:if="${observationError!=null}" th:text="${observationError}"></p>
<section class="card" th:if="${context!=null}"><h2 th:text="${context.runName()}"></h2><p>이 배포에 사용된 환경의 현재 OKE 연결을 표시합니다. 같은 클러스터의 앱 목록이며, 배포 당시의 앱·버전과 일치한다는 의미는 아닙니다.</p><p th:each="n:${context.notices()}" th:text="${n}"></p><p th:if="${context.targets().isEmpty()}">조회 가능한 OKE 대상 환경이 없습니다. VM·Function은 해당 실행 자원 화면에서 확인하세요.</p></section>
<section class="card section-stack" th:each="g:${groups}"><h2 th:text="${g.target().name()}"></h2><details><summary>클러스터 OCID</summary><p class="source-url" th:text="${g.target().cluster()}"></p></details><div class="table-scroll"><table class="data-table" th:if="${!g.apps().isEmpty()}"><thead><tr><th>등록 앱</th><th>namespace / Deployment</th><th>조회</th></tr></thead><tbody><tr th:each="a:${g.apps()}"><td class="table-cell" th:text="${a.name()}"></td><td class="table-cell" th:text="${a.namespace()+' / '+a.deployment()}"></td><td class="table-cell"><a th:href="@{/agents/connections(selected=${a.id()})}">상태·이벤트</a> · <a th:href="@{/agents/connections/logs(selected=${a.id()})}">Pod 로그</a></td></tr></tbody></table></div><p th:if="${g.apps().isEmpty()}">이 클러스터에 등록된 OKE 조회 연결이 없습니다.</p><div class="form-toolbar"><a class="ui-button" th:href="@{/agents/connections/oke(cluster=${g.target().cluster()})}">OKE 조회 연결 등록</a></div></section></main></body></html>
