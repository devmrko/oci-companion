<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('OCI 사용 안내')}"></head><body><header th:replace="~{layout :: header}"></header><main class="page-content app-content"><div th:replace="~{layout :: notice}"></div><h1>OCI에서 직접 하는 방법</h1><p class="muted">콘솔 절차 · CLI 명령 · SDK 대응. &lt;값&gt;은 실제 값으로 변경.</p><nav class="guide-nav"><a th:each="g : ${guides}" th:href="${'#' + g.id()}" th:text="${g.title()}"></a></nav>
<article class="card guide" th:each="g : ${guides}" th:id="${g.id()}"><div class="section-heading"><h2 th:text="${g.title()}"></h2><a th:href="${g.url()}" target="_blank" rel="noopener noreferrer">공식 문서 ↗</a></div><p th:text="${g.description()}"></p><h3>콘솔·설정 절차</h3><ol><li th:each="step : ${g.steps()}" th:text="${step}"></li></ol><h3>CLI 예시</h3><pre class="code-block"><code th:text="${g.cli()}"></code></pre><h3>SDK / API 대응</h3><p class="mono" th:text="${g.sdk()}"></p><aside><strong>필요 권한</strong><p th:text="${g.permissions()}"></p></aside></article>
</main><footer th:replace="~{layout :: footer}" class="page-footer app-footer"></footer></body></html>
