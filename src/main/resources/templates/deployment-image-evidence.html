<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="result(run)" th:if="${run != null}" class="section-stack"><p th:text="${'OCI 실행 상태: '+run.cloudState()}"></p><p role="status" th:text="${run.detail()}"></p><p th:if="${run.cloudState()=='SUCCEEDED' and run.state()!='SUCCEEDED'}">OCI 실행 완료만으로 배포 성공을 판정하지 않습니다.</p><div class="table-scroll" th:if="${!run.images().isEmpty()}"><table class="data-table"><thead><tr><th>대상 Pod·컨테이너</th><th>기대 digest</th><th>실제 imageID digest</th><th>Ready</th></tr></thead><tbody><tr th:each="image:${run.images()}"><td th:text="${image.workload()+' · '+image.pod()+' / '+image.container()}"></td><td class="source-url" th:text="${image.expected()}"></td><td class="source-url" th:text="${image.actual()}"></td><td th:text="${image.ready() ? 'Ready' : '미준비'}"></td></tr></tbody></table></div></section></body></html>
