<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('프로젝트 설정')}"></head><body><header th:replace="~{layout :: header}"></header><main class="narrow"><div th:replace="~{layout :: notice}"></div><a href="/">← 프로젝트</a><h1 th:text="${workspace == null ? '프로젝트 등록' : '프로젝트 설정'}"></h1>
<p class="muted">저장하면 로컬 설정만 변경됩니다. OCI 리소스나 저장소 파일을 자동 변경하지 않습니다.</p>
<form th:action="@{/projects}" method="post" class="card form-grid"><input type="hidden" name="id" th:value="${workspace?.id()}">
<label>프로젝트 이름<input name="name" required maxlength="100" placeholder="DB Companion" th:value="${workspace?.name()}"></label>
<label>Git 저장소 URL<input name="repositoryUrl" type="url" required maxlength="500" placeholder="https://github.com/devmrko/db-companion" th:value="${workspace?.repositoryUrl()}"><small>인증정보 없는 HTTPS URL. 저장소 접근·자동 감지는 후속 지원입니다.</small></label>
<div class="columns"><label>브랜치<input name="branch" required maxlength="200" th:value="${workspace == null ? 'main' : workspace.branch()}"></label><label>빌드 템플릿<select name="recipe"><option th:each="r : ${recipes}" th:value="${r.id()}" th:selected="${workspace != null and workspace.recipe() == r.id()}" th:text="${r.label()}"></option></select></label></div>
<label>컴파트먼트 OCID<input name="compartmentId" required maxlength="255" th:value="${workspace == null ? (connection.demo() ? 'demo-compartment' : '') : workspace.compartmentId()}" placeholder="ocid1.compartment..."><small>파이프라인이 있는 컴파트먼트입니다.</small></label>
<hr><h3>기존 OCI DevOps 파이프라인 연결</h3><p class="muted">먼저 프로젝트를 저장하면 해당 컴파트먼트의 파이프라인 목록을 조회할 수 있습니다.</p>
<label>빌드 파이프라인 OCID<input name="buildPipelineId" maxlength="255" th:value="${workspace == null ? (connection.demo() ? 'demo-build' : '') : workspace.buildPipelineId()}"></label>
<label>VM 배포 파이프라인 OCID<input name="deployPipelineId" maxlength="255" th:value="${workspace == null ? (connection.demo() ? 'demo-vm' : '') : workspace.deployPipelineId()}"></label>
<div class="actions"><button class="primary" type="submit">프로젝트 저장</button><a href="/guides#source">OCI에서 직접 하는 방법 →</a></div></form></main><footer th:replace="~{layout :: footer}"></footer></body></html>
