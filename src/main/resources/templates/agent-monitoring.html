<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('에이전트 실행')}"></head><body>
<div th:replace="~{layout :: header}"></div><main class="catalog-shell page-content app-content"><div th:replace="~{layout :: notice}"></div>
<h1>에이전트 실행</h1><p>배포된 앱의 상태와 모델·도구 실행 결과를 확인합니다.</p><a class="ui-button" href="/agents">새로 조회</a>
<section class="card" th:if="${agent != null}"><h2 th:text="${agent.name()}"></h2><p><strong th:text="${agent.status()}"></strong> · 앱 버전 <span th:text="${agent.version()}"></span></p><p th:text="${agent.notice()}"></p>
<h3>플랫폼 기능 상태</h3><p th:text="${agent.capabilityNotice()}"></p>
<div class="table-scroll" th:if="${!agent.capabilities().isEmpty()}"><table class="data-table"><thead><tr><th>기능</th><th>구현·설정</th><th>연결·운영 검증</th></tr></thead><tbody><tr th:each="c : ${agent.capabilities()}"><td th:text="${c.name()}"></td><td th:text="${c.status()}"></td><td th:text="${c.health()}"></td></tr></tbody></table></div>
<h3>실행 기록</h3><div class="table-scroll"><table class="data-table"><thead><tr><th class="table-heading">요청 ID</th><th class="table-heading">결과 / 버전</th><th class="table-heading">모델 / 리전</th><th class="table-heading">토큰 입력 / 출력</th><th class="table-heading">지연 ms</th><th class="table-heading">도구 / 단계 / 결과</th><th class="table-heading">오류</th></tr></thead>
<tbody><tr th:each="t : ${agent.traces()}"><td class="table-cell" th:text="${t.requestId()}"></td><td class="table-cell"><span th:text="${t.status()}"></span> / <span th:text="${t.version()}"></span><br><small th:text="${t.mode()}"></small></td><td class="table-cell"><span th:text="${t.model()}"></span><br><small th:text="${t.region()}"></small></td><td class="table-cell"><span th:text="${t.inputTokens()}"></span> / <span th:text="${t.outputTokens()}"></span></td><td class="table-cell" th:text="${t.elapsedMs()}"></td><td class="table-cell" th:text="${t.tools()}"></td><td class="table-cell" th:text="${t.errorCode()}"></td></tr></tbody></table></div>
<p th:if="${agent.traces().isEmpty()}">표시할 실행 기록이 없습니다.</p></section></main><footer th:replace="~{layout :: footer}"></footer></body></html>
