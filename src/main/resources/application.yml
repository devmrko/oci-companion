server:
  address: 127.0.0.1
  port: ${PORT:8091}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: oci-companion
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
foundation:
  jobs:
    enabled: false
companion:
  git-hosts: ${COMPANION_GIT_HOSTS:}
  oci-config: ${OCI_CONFIG_FILE:${user.home}/.oci/config}
  data-dir: ${COMPANION_DATA_DIR:.data/catalog}
