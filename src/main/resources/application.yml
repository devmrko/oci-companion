server:
  address: 127.0.0.1
  port: ${PORT:8091}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: oci-companion
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:.data/companion.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
      connection-timeout: 5000
      data-source-properties:
        foreign_keys: true
        busy_timeout: 5000
        journal_mode: WAL
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
foundation:
  jobs:
    enabled: false
companion:
  oci-config: ${OCI_CONFIG_FILE:${user.home}/.oci/config}
